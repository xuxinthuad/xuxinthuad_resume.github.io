about_content: >
   I am currently an Algorithm Expert in the Prediction and Planning Department at Horizon Robotics' Software Platform Product Line in Beijing, where I lead key initiatives in autonomous driving prediction and planning technologies. Prior to this, I served as a Senior Algorithm Engineer at Xiaopeng Autonomous Driving Center (2022–2023), contributing to the mass production of advanced driver-assistance systems, and began my career as an Algorithm Engineer at JD X Research Department (2020–2022), focusing on cutting-edge AI research for robotics.
   
   Holding a Master’s degree in Instrumentation and Measurement Engineering from Tsinghua University (2017–2020) and a Bachelor of Engineering in Measurement and Control Technology from Shandong University (2013–2017), my work bridges academic rigor with industrial innovation, specializing in machine learning, deep learning, and their applications in autonomous driving.

   These experiences have honed my ability to design efficient, robust algorithms for real-world autonomy challenges. I am deeply passionate about advancing AI-driven mobility solutions and leveraging cross-disciplinary expertise to push the frontiers of autonomous driving technology.
